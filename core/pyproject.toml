[project]
name = "core"
version = "0.1.0"
description = "Shared domain models, hazard weights and capacity norms. Pure Python — no geo/ML deps."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
